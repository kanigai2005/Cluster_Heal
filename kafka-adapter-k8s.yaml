apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-kafka
  namespace: default
  labels:
    app: sre-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-kafka
  template:
    metadata:
      labels:
        app: sre-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.4.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://localhost:9092,PLAINTEXT_HOST://sre-kafka:29092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:29093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
---
apiVersion: v1
kind: Service
metadata:
  name: sre-kafka
  namespace: default
spec:
  ports:
    - name: broker
      port: 29092
      targetPort: 29092
  selector:
    app: sre-kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-kafka-adapter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-kafka-adapter
  template:
    metadata:
      labels:
        app: prometheus-kafka-adapter
    spec:
      containers:
        - name: adapter
          image: telefonica/prometheus-kafka-adapter:1.8.0
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKER_LIST
              value: "sre-kafka:29092"
            - name: KAFKA_TOPIC
              value: "sre-pod-telemetry"
            - name: PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-kafka-adapter
  namespace: default
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: prometheus-kafka-adapter
